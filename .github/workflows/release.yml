name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Materialize release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wiiremotex-release.jks"

      - name: Build signed release APK
        env:
          WIIREMOTEX_KEYSTORE_PATH: ${{ runner.temp }}/wiiremotex-release.jks
          WIIREMOTEX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WIIREMOTEX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WIIREMOTEX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify APK signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Stage Android artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/WiiRemoteX-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32 bridge
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: latest
          target: esp32
          path: firmware/esp32

      - name: Stage ESP32 artifact
        run: |
          mkdir -p dist
          cp firmware/esp32/build/wiiremotex_esp32_bridge.bin dist/
          cp firmware/esp32/build/bootloader/bootloader.bin dist/
          cp firmware/esp32/build/partition_table/partition-table.bin dist/
          cp firmware/esp32/build/flash_args dist/
          cp firmware/esp32/build/flasher_args.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-esp32
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, esp32]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: package/android

      - uses: actions/download-artifact@v4
        with:
          name: release-esp32
          path: package/esp32

      - name: Assemble versioned package
        run: |
          cp firmware/esp32/FLASHING.md package/FLASHING.md
          (
            cd package
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )
          mv package "WiiRemoteX-${GITHUB_REF_NAME}"
          zip -r "WiiRemoteX-${GITHUB_REF_NAME}.zip" "WiiRemoteX-${GITHUB_REF_NAME}"
          sha256sum "WiiRemoteX-${GITHUB_REF_NAME}.zip" > RELEASE_SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_ARGS=""
          case "$GITHUB_REF_NAME" in
            *-*) EXTRA_ARGS="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "WiiRemoteX-${GITHUB_REF_NAME}.zip" \
            "WiiRemoteX-${GITHUB_REF_NAME}/android/WiiRemoteX-${GITHUB_REF_NAME}.apk" \
            "WiiRemoteX-${GITHUB_REF_NAME}/esp32/wiiremotex_esp32_bridge.bin" \
            "WiiRemoteX-${GITHUB_REF_NAME}/esp32/bootloader.bin" \
            "WiiRemoteX-${GITHUB_REF_NAME}/esp32/partition-table.bin" \
            RELEASE_SHA256SUMS.txt \
            --title "WiiRemoteX ${GITHUB_REF_NAME}" \
            --generate-notes \
            $EXTRA_ARGS
