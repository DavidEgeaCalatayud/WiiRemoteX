name: Multiplatform CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Core + shared JVM tests
        run: gradle :core:protocol:jvmTest :core:session:jvmTest :core:trace:jvmTest :shared:jvmTest

  ios-framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compile shared iOS simulator framework
        run: gradle :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS app for simulator
        working-directory: iosApp
        env:
          OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED: "NO"
        run: |
          xcodebuild \
            -project WiiRemoteXiOS.xcodeproj \
            -scheme WiiRemoteXiOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
